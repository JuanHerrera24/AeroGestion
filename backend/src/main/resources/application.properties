spring.application.name=aerogestion
server.port=8080

# MongoDB (local). Para MongoDB Atlas reemplazar por la URI del cluster.
spring.data.mongodb.uri=mongodb://localhost:27017/aerogestion
spring.data.mongodb.auto-index-creation=true

# JSON legible y fechas en formato ISO (2026-11-01T08:00:00)
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Correo (completar con una cuenta de prueba; no subir credenciales reales a GitHub)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
