<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div class="card auth-card ancho">
        <h1>Crear cuenta de pasajero</h1>
        <p class="texto-suave">Regístrate para reservar vuelos y elegir tus asientos.</p>

        <form th:action="@{/registro}" th:object="${form}" method="post">
            <div class="grid grid-2" style="gap: 0 20px;">
                <div class="campo" th:classappend="${#fields.hasErrors('nombre')} ? 'campo-error'">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" th:field="*{nombre}">
                    <span class="error-campo" th:errors="*{nombre}"></span>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('apellido')} ? 'campo-error'">
                    <label for="apellido">Apellido</label>
                    <input id="apellido" th:field="*{apellido}">
                    <span class="error-campo" th:errors="*{apellido}"></span>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('email')} ? 'campo-error'">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}">
                    <span class="error-campo" th:errors="*{email}"></span>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('password')} ? 'campo-error'">
                    <label for="password">Contraseña (mín. 8 caracteres)</label>
                    <input id="password" type="password" th:field="*{password}">
                    <span class="error-campo" th:errors="*{password}"></span>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('documentoIdentidad')} ? 'campo-error'">
                    <label for="documentoIdentidad">Documento de identidad</label>
                    <input id="documentoIdentidad" th:field="*{documentoIdentidad}">
                    <span class="error-campo" th:errors="*{documentoIdentidad}"></span>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('telefono')} ? 'campo-error'">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" th:field="*{telefono}">
                    <span class="error-campo" th:errors="*{telefono}"></span>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'campo-error'">
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input id="fechaNacimiento" type="date" th:field="*{fechaNacimiento}">
                    <span class="error-campo" th:errors="*{fechaNacimiento}"></span>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('nacionalidad')} ? 'campo-error'">
                    <label for="nacionalidad">Nacionalidad</label>
                    <input id="nacionalidad" th:field="*{nacionalidad}">
                    <span class="error-campo" th:errors="*{nacionalidad}"></span>
                </div>
            </div>
            <button class="btn btn-oro btn-bloque" type="submit">Crear cuenta</button>
        </form>
        <p class="texto-suave" style="margin-top: 16px;">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
