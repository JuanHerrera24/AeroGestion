<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div class="card auth-card">
        <h1>Iniciar sesión</h1>
        <p class="texto-suave">Accede para reservar vuelos o administrar la aerolínea.</p>

        <div th:replace="~{fragments :: alertas}"></div>
        <div class="alerta alerta-error" th:if="${param.error}">Credenciales inválidas.</div>

        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" required>
            </div>
            <button class="btn btn-bloque" type="submit">Entrar</button>
        </form>

        <p class="texto-suave" style="margin-top: 16px;">
            ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a>
        </p>

        <div class="demo-box">
            <strong>Cuentas de demostración</strong><br>
            Administrador: admin@aerogestion.com / Admin2026!<br>
            Pasajero: pasajero@aerogestion.com / Pasajero2026!
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
