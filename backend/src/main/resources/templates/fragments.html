<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · AeroGestión'">AeroGestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<nav class="navbar" th:fragment="navbar">
    <div class="container">
        <a class="brand" th:href="@{/}">
            <span class="brand-icon">✈</span><span>Aero<span class="acento">Gestión</span></span>
        </a>
        <div class="nav-links">
            <a th:href="@{/}">Buscar vuelos</a>

            <th:block sec:authorize="hasRole('PASAJERO')">
                <a th:href="@{/reservas}">Mis reservas</a>
            </th:block>

            <th:block sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin}">Panel</a>
                <a th:href="@{/admin/vuelos}">Vuelos</a>
                <a th:href="@{/admin/aviones}">Flota</a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <span class="usuario" sec:authentication="name">usuario</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">Salir</button>
                </form>
            </th:block>

            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}">Iniciar sesión</a>
                <a class="btn btn-oro btn-sm" th:href="@{/registro}">Crear cuenta</a>
            </th:block>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div class="alerta alerta-exito" th:if="${exito}" th:text="${exito}"></div>
    <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>
    <div class="alerta alerta-advertencia" th:if="${advertencia}" th:text="${advertencia}"></div>
</div>

<!-- Tarjeta de ruta reutilizable: origen → destino con horas -->
<div th:fragment="ruta(v)" class="ruta">
    <div class="punto">
        <div class="hora" th:text="${#temporals.format(v.fechaHoraSalida, 'HH:mm')}">06:00</div>
        <div class="iata" th:text="${v.origen.codigoIata}">LIM</div>
        <div class="ciudad" th:text="${v.origen.ciudad}">Lima</div>
    </div>
    <div class="linea">
        <span class="avion">✈</span>
        <span th:text="${v.duracionTexto}">1h 20m</span>
    </div>
    <div class="punto">
        <div class="hora" th:text="${#temporals.format(v.fechaHoraLlegada, 'HH:mm')}">07:20</div>
        <div class="iata" th:text="${v.destino.codigoIata}">CUZ</div>
        <div class="ciudad" th:text="${v.destino.ciudad}">Cusco</div>
    </div>
</div>

<footer class="footer" th:fragment="footer">
    <div class="container">
        <span>✈ AeroGestión · Sistema de gestión de aerolínea</span>
        <span>Java · Spring Boot · MongoDB</span>
    </div>
</footer>

</body>
</html>
