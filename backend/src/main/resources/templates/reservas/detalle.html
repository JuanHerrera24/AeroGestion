<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reserva')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments :: alertas}"></div>

    <div class="card" style="text-align: center;">
        <p class="texto-suave">Código de reserva</p>
        <div class="codigo-reserva" th:text="${reserva.codigoReserva}">AG-7K2P9X</div>
        <p style="margin-top: 14px;">
            <span class="badge" th:classappend="${'badge-' + reserva.estado}" th:text="${reserva.estado}">CONFIRMADA</span>
        </p>
    </div>

    <div class="card">
        <div class="card-title">
            <h2 th:text="${'Vuelo ' + reserva.vuelo.codigoVuelo}">Vuelo</h2>
            <span class="texto-suave" th:text="${#temporals.format(reserva.vuelo.fechaHoraSalida, 'EEEE dd MMMM yyyy')}"></span>
        </div>
        <div th:replace="~{fragments :: ruta(${reserva.vuelo})}"></div>
    </div>

    <div class="grid grid-2">
        <div class="card">
            <h2>Asientos</h2>
            <table>
                <thead><tr><th>Asiento</th><th>Clase</th><th style="text-align: right;">Precio</th></tr></thead>
                <tbody>
                <tr th:each="a : ${reserva.asientos}">
                    <td><strong th:text="${a.numero}">12A</strong></td>
                    <td><span class="badge" th:classappend="${'badge-' + a.clase}" th:text="${a.clase}"></span></td>
                    <td style="text-align: right;" th:text="${'$' + #numbers.formatDecimal(a.calcularPrecio(reserva.vuelo.tarifaBase), 1, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                <tr>
                    <td colspan="2"><strong>Total</strong></td>
                    <td style="text-align: right;"><strong style="font-size: 1.2rem;" th:text="${'$' + #numbers.formatDecimal(reserva.total, 1, 'COMMA', 2, 'POINT')}"></strong></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card">
            <h2>Pasajero</h2>
            <dl class="lista-datos">
                <dt>Nombre</dt><dd th:text="${reserva.pasajero.nombreCompleto}"></dd>
                <dt>Documento</dt><dd th:text="${reserva.pasajero.documentoIdentidad}"></dd>
                <dt>Email</dt><dd th:text="${reserva.pasajero.email}"></dd>
                <dt>Reservado</dt><dd th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy HH:mm')}"></dd>
            </dl>
            <div class="acciones-inline" style="margin-top: 20px;">
                <a class="btn btn-claro" th:href="@{/reservas}">← Mis reservas</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
