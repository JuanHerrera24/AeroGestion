<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mis reservas')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments :: alertas}"></div>

    <div class="card">
        <div class="card-title">
            <h2>Mis reservas</h2>
            <a class="btn btn-oro btn-sm" th:href="@{/}">+ Nueva reserva</a>
        </div>

        <div class="vacio" th:if="${#lists.isEmpty(reservas)}">
            <div class="icono">🎫</div>
            <p>Aún no tienes reservas.</p>
        </div>

        <div class="tabla-wrap" th:unless="${#lists.isEmpty(reservas)}">
            <table>
                <thead>
                <tr><th>Código</th><th>Vuelo</th><th>Ruta</th><th>Salida</th><th>Asientos</th><th>Total</th><th>Estado</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reservas}">
                    <td><a th:href="@{/reservas/{id}(id=${r.id})}"><strong th:text="${r.codigoReserva}"></strong></a></td>
                    <td th:text="${r.vuelo.codigoVuelo}"></td>
                    <td th:text="${r.vuelo.origen.codigoIata + ' → ' + r.vuelo.destino.codigoIata}"></td>
                    <td th:text="${#temporals.format(r.vuelo.fechaHoraSalida, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${#strings.listJoin(r.numerosAsiento, ', ')}"></td>
                    <td><strong th:text="${'$' + #numbers.formatDecimal(r.total, 1, 'COMMA', 2, 'POINT')}"></strong></td>
                    <td><span class="badge" th:classappend="${'badge-' + r.estado}" th:text="${r.estado}"></span></td>
                    <td>
                        <form th:if="${r.puedeCancelarse()}" th:action="@{/reservas/{id}/cancelar(id=${r.id})}" method="post">
                            <button class="btn btn-peligro btn-sm" type="submit">Cancelar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="texto-suave" style="font-size: .85rem; margin-top: 14px;">
            Puedes cancelar una reserva hasta 24 horas antes de la salida del vuelo.
        </p>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
