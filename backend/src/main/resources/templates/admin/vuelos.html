<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Vuelos')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments :: alertas}"></div>

    <div class="card">
        <div class="card-title">
            <h2>🗓 Vuelos</h2>
            <a class="btn btn-oro" th:href="@{/admin/vuelos/nuevo}">+ Programar vuelo</a>
        </div>

        <form class="filtros" th:action="@{/admin/vuelos}" method="get" style="margin-bottom: 20px;">
            <div class="campo">
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="">Todos</option>
                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}" th:selected="${e == estado}"></option>
                </select>
            </div>
            <div class="campo">
                <label for="desde">Desde</label>
                <input id="desde" type="date" name="desde" th:value="${desde}">
            </div>
            <div class="campo">
                <label for="hasta">Hasta</label>
                <input id="hasta" type="date" name="hasta" th:value="${hasta}">
            </div>
            <button class="btn btn-claro" type="submit">Filtrar</button>
            <a class="btn btn-claro" th:href="@{/admin/vuelos}">Limpiar</a>
        </form>

        <p class="texto-suave" th:text="${#lists.size(vuelos) + ' vuelo(s)'}"></p>

        <div class="tabla-wrap">
            <table>
                <thead>
                <tr><th>Vuelo</th><th>Ruta</th><th>Salida</th><th>Avión</th><th>Tarifa</th><th>Ocupación</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vuelos}">
                    <td><strong th:text="${v.codigoVuelo}"></strong></td>
                    <td th:text="${v.origen.codigoIata + ' → ' + v.destino.codigoIata}"></td>
                    <td th:text="${#temporals.format(v.fechaHoraSalida, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${v.avion.matricula}"></td>
                    <td th:text="${'$' + #numbers.formatDecimal(v.tarifaBase, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td>
                        <div class="barra"><span th:style="${'width:' + v.porcentajeOcupacion + '%'}"></span></div>
                        <small class="texto-suave" th:text="${#numbers.formatDecimal(v.porcentajeOcupacion, 1, 1) + '%'}"></small>
                    </td>
                    <td><span class="badge" th:classappend="${'badge-' + v.estado}" th:text="${v.estado}"></span></td>
                    <td>
                        <div class="acciones-inline" th:if="${v.estado.name() != 'CANCELADO'}">
                            <form th:action="@{/admin/vuelos/{id}/estado(id=${v.id})}" method="post">
                                <select name="estado" aria-label="Nuevo estado">
                                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}" th:selected="${e == v.estado}"></option>
                                </select>
                                <button class="btn btn-claro btn-sm" type="submit">OK</button>
                            </form>
                            <a class="btn btn-claro btn-sm" th:if="${v.puedeCancelarse()}"
                               th:href="@{/admin/vuelos/{id}/editar(id=${v.id})}">Editar</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="texto-suave" style="font-size: .85rem; margin-top: 14px;">
            Al pasar un vuelo a CANCELADO, sus reservas se cancelan y se avisa a los pasajeros por correo.
        </p>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
