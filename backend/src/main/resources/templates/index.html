<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<section class="hero">
    <div class="container">
        <h1>¿A dónde volamos hoy?</h1>
        <p>Busca vuelos, elige tu asiento ideal y reserva en minutos.</p>
    </div>
</section>

<main class="container">
    <div th:replace="~{fragments :: alertas}"></div>
    <div class="alerta alerta-exito" th:if="${param.salir}">Cerraste sesión correctamente.</div>

    <div class="card">
        <form class="form-busqueda" th:action="@{/vuelos/buscar}" method="get">
            <div class="campo">
                <label for="origen">Origen</label>
                <select id="origen" name="origen" required>
                    <option th:each="a, it : ${aeropuertos}" th:value="${a.id}"
                            th:text="${a.ciudad + ' (' + a.codigoIata + ')'}"
                            th:selected="${a.codigoIata == 'LIM'}">Lima (LIM)</option>
                </select>
            </div>
            <div class="campo">
                <label for="destino">Destino</label>
                <select id="destino" name="destino" required>
                    <option th:each="a : ${aeropuertos}" th:value="${a.id}"
                            th:text="${a.ciudad + ' (' + a.codigoIata + ')'}"
                            th:selected="${a.codigoIata == 'CUZ'}">Cusco (CUZ)</option>
                </select>
            </div>
            <div class="campo">
                <label for="fecha">Fecha</label>
                <input id="fecha" type="date" name="fecha" th:value="${hoy}" required>
            </div>
            <button class="btn btn-oro" type="submit">🔎 Buscar vuelos</button>
        </form>
    </div>

    <div class="card-title">
        <h2>Próximas salidas</h2>
    </div>
    <div class="vacio card" th:if="${#lists.isEmpty(proximos)}">
        <div class="icono">🛫</div>
        <p>No hay vuelos programados por ahora.</p>
    </div>
    <div class="grid grid-2">
        <a class="card" th:each="r : ${proximos}" th:href="@{/vuelos/{id}(id=${r.vuelo.id})}" style="color: inherit; text-decoration: none; margin: 0;">
            <div class="vuelo-card">
                <div>
                    <div th:replace="~{fragments :: ruta(${r.vuelo})}"></div>
                    <div class="meta">
                        <span th:text="${'📅 ' + #temporals.format(r.vuelo.fechaHoraSalida, 'EEE dd MMM')}">mar 28 oct</span>
                        <span th:text="${'✈ ' + r.vuelo.codigoVuelo}">AG101</span>
                        <span th:text="${'💺 ' + r.asientosDisponibles + ' libres'}">120 libres</span>
                    </div>
                </div>
                <div class="precio">
                    <div class="desde">desde</div>
                    <div class="monto" th:text="${'$' + #numbers.formatDecimal(r.precioDesde, 1, 'COMMA', 0, 'POINT')}">$89</div>
                </div>
            </div>
        </a>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
